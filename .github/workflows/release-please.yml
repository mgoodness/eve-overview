name: release-please

# release-please reads Conventional Commits on the default branch and opens a
# release PR. Merging that PR is what creates the tag and the GitHub Release.
#
# It must push the release PR and the tag as a GitHub App, not GITHUB_TOKEN: a
# push or PR authored by GITHUB_TOKEN cannot trigger the next workflow run, so
# the tag would be created and the release workflow that attaches the profile
# would never fire — silently.
on:
  push:
    branches: [main]

# The App token carries every permission this job needs; the default token gets
# nothing.
permissions: {}

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      # Scoped to exactly what release-please does: push the release branch and
      # tag (contents) and open the release PR (pull requests).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
