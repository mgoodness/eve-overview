name: Release

# release-please creates the tag and the GitHub Release when its release PR
# merges. This workflow then attaches the generated profile to that release and
# appends the attribution and checksums to its notes.
#
# It does not create the release or the tag — release-please owns those — so the
# default GITHUB_TOKEN is enough here. The App token that avoids the loop-trap
# lives in release-please.yml.
on:
  release:
    types: [published]

# Uploading assets and editing the notes needs contents: write.
permissions:
  contents: write

jobs:
  attach-profile:
    name: attach-profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The generator fetches the pinned reference pack and SDE and verifies
      # both against their SHA-256, so a release can only be built from the
      # data the pins name. The pins it used ride in the profile's own header,
      # and are repeated in the notes below.
      - name: Generate profile
        run: go run ./cmd/eve-overview generate -out overview.yaml
      - name: Checksum the profile
        run: sha256sum overview.yaml > SHA256SUMS
      - name: Attach the profile and its checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" overview.yaml SHA256SUMS --clobber
      # release-please wrote the changelog; append the attribution, the
      # reproducibility pins and the checksum of the asset a consumer downloads.
      - name: Append attribution and checksums to the notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --json body --jq .body > generated-notes.md
          {
            cat generated-notes.md
            printf '\n---\n\n'
            cat docs/release-notes-template.md
            printf '\n```\n'
            cat SHA256SUMS
            printf '```\n'
          } > release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md
